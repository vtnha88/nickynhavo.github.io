<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo Projects</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 48px 24px;
            background: #f5f3ef;
            color: #24211e;
            font: 16px/1.5 Arial, Helvetica, sans-serif;
        }
        main {
            width: min(100%, 680px);
            margin: 0 auto;
        }
        h1 {
            margin: 0 0 8px;
            font-size: clamp(32px, 7vw, 48px);
            letter-spacing: -0.06em;
        }
        p {
            margin: 0 0 32px;
            color: #746d66;
        }
        ul {
            margin: 0;
            padding: 0;
            list-style: none;
            border-top: 1px solid #d6d1ca;
        }
        li {
            border-bottom: 1px solid #d6d1ca;
        }
        a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 4px;
            color: inherit;
            font-weight: 700;
            text-decoration: none;
            transition: color 160ms ease, padding 160ms ease;
        }
        a::after {
            content: "→";
            font-size: 20px;
        }
        a:hover {
            padding-right: 10px;
            padding-left: 10px;
            color: #a95740;
        }
        a:focus-visible {
            outline: 2px solid #a95740;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Demo Projects</h1>
        <p>Danh sách các dự án demo.</p>
        <ul>
            <li><a href="sme-caphe-store/index.html">SME Caphe Store</a></li>
        </ul>
    </main>
</body>
</html>
